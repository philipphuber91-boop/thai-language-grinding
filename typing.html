<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Typing Mode</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🏝 Quest</h1>

<div id="auftrag" class="quest-card">

    <h2>📜 Auftrag</h2>

    <p id="storyText">
        Lies zuerst den deutschen Text.
    </p>

    <button id="startDeutsch">
        Deutsch beginnen
    </button>

</div>

<div id="deutsch" class="quest-card">

    <h2 id="questTitel"></h2>

    <div id="deutscherText"></div>

    <button id="startThai">
        Deutsch abgeschlossen
    </button>

</div>

<div id="typingBereich" class="quest-card">

    <h2>⌨️ Thai Typing</h2>

    <p>Zeit:</p>
    <p id="zeitAnzeige">00:00</p>

    <p>Buchstaben/Min:</p>
    <p id="wpmAnzeige">0.0</p>

    <p>Genauigkeit:</p>
    <p id="accuracyAnzeige">100%</p>

    <hr>

    <div id="textAnzeige"></div>

    <br>

    <textarea id="eingabe"></textarea>

</div>

<div id="questComplete" class="popup">

    <div class="popup-content">

      <h2>🏆 QUEST COMPLETE</h2>

<hr>

<p id="popupQuestText"></p>

<p>📖 Kapitel: <span id="popupKapitel"></span></p>

<br>

<p>⏱ Zeit</p>
<p id="popupZeit"></p>

<p>⌨️ Buchstaben/Min</p>
<p id="popupCPM"></p>

<p>🎯 Genauigkeit</p>
<p id="popupAccuracy"></p>

<hr>

<h3>Language Grinding</h3>

<p>Version 0.0.5</p>

<p>💾 Progress Update</p>

<p>⭐ First Playable Engine</p>

<br>

<button id="weiterButton">

    Zur Weltkarte

</button>

    </div>

</div>
<script src="quests.js"></script>
<script src="typing.js"></script>

</body>

</html>
