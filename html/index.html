<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>Language Grinding</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

    <h1>THAI</h1>

    <h2>LANGUAGE GRINDING</h2>

    <p>LEVEL 1 • ANFÄNGER</p>

</header>

    <div class="layout">

<aside class="sidebar">

    <div class="player-card">

        <h2>🇹🇭 Flipu</h2>

        <p>Level 1</p>

        <div class="xp-bar">

            <div class="xp-fill"></div>

        </div>

        <p>XP 0 / 100</p>

    </div>

    <div class="menu-card">

        <button>🗺 Weltkarte</button>

        <button id="campaignMenuButton">

    📖 Kampagne

</button>

<button id="missionsMenuButton">

    🎯 Missionen

</button>

<button id="statsButton" onclick="openStats()">

    Statistik

</button>
    

        <button id="achievementButton">

    🏆 Erfolge

</button>

        <button>⚙ Einstellungen</button>

    </div>

</aside>

<main class="content">

    <div id="questListe"></div>

</main>

<div id="startQuestOverlay" class="start-quest-overlay">

    <div class="start-quest-window">

        <h2 id="startOverlayTitle">

            📖 Kampagne starten

        </h2>

        <div class="start-quest-info">

            <div class="start-quest-image">

                <img
                    id="startQuestImage"
                    src="../assets/quest/urlaub.png"
                    alt="Quest">

            </div>

            <div class="start-quest-meta">

                <h3 id="startQuestName">

                    Im Urlaub

                </h3>

                <div class="start-quest-stats">

                    <span id="startQuestDifficulty">

                        🏅 A1

                    </span>

                    <span id="startQuestWords">

                        📖 53 Wörter

                    </span>

                    <span id="startQuestTime">

                        ⏱ --:--

                    </span>

                </div>

                <div class="start-quest-records">

                    <div class="record-box">

                        <div class="record-title">

                            🏆 Rekord

                        </div>

                        <div
                            class="record-value"
                            id="startQuestBestTime">

                            --:--

                        </div>

                    </div>

                    <div class="record-box">

                        <div class="record-title">

                            🎯 Genauigkeit

                        </div>

                        <div
                            class="record-value"
                            id="startQuestAccuracy">

                            -- %

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="mode-container">

            <div class="mode-card">

                <h3>📚 Lernen</h3>

                <p>📖 Deutscher Text sichtbar</p>

                <p>🧠 Lernphase</p>

                <p>🏁 Danach Prüfung</p>

                <button id="campaignButton">

                    ▶ START

                </button>

            </div>

            <div class="mode-card challenge">

                <h3>🏆 Challenge</h3>

                <p>🚫 Keine Hilfe</p>

                <p>🏆 Alles zählt</p>

                <p>⚡ Rekorde</p>

                <button id="challengeButton">

                    ▶ START

                </button>

            </div>

        </div>

        <button id="cancelQuestButton">

            Abbrechen

        </button>

    </div>

</div>

<script src="../js/save.js"></script>

<script src="../data/quests.js"></script>
<script src="../data/missions.js"></script>

<script src="../js/achievementData.js"></script>
<script src="../js/achievements.js"></script>

<script src="../js/player.js"></script>

<script>

loadPlayer();
loadQuestStats();

</script>

<script src="../js/achievementRenderer.js"></script>
<script src="../js/engine.js"></script>



</body>

</html>
