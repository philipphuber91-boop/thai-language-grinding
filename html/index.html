<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <!-- Mobile: sorgt dafür, dass Media Queries an der echten Gerätebreite ausgerichtet werden -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Language Grinding</title>

    <link rel="stylesheet" href="../style.css">
    <!-- Nur additive Anpassungen für schmale Viewports, ändert keine bestehende Desktop-Regel -->
    <link rel="stylesheet" href="../css/mobile.css">

    <!-- PWA: Installierbarkeit & Offline-Support, ohne bestehende Optik/Logik zu verändern -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#15110d">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/pwa/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/pwa/favicon-16.png">
    <link rel="apple-touch-icon" href="../assets/icons/pwa/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Thai Grinding">

</head>

<body>

<!-- Mobile: öffnet/schließt die Sidebar (siehe css/mobile.css und js/engine.js) -->
<button id="sidebarToggleButton" class="hamburger-button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mainSidebar">☰</button>

<!-- Mobile: abgedunkelter Hintergrund hinter der geöffneten Sidebar -->
<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<header class="topbar">

    <h1>THAI</h1>

    <h2>LANGUAGE GRINDING</h2>

</header>

    <div class="layout">

<aside class="sidebar" id="mainSidebar">

    <div class="player-card">

        <h2>🇹🇭 Flipu</h2>

        <p>Level 1</p>

        <div class="xp-bar">

            <div class="xp-fill"></div>

        </div>

        <p>XP 0 / 100</p>

    </div>

    <div class="menu-card">

        <button>🗺 Weltkarte</button>

        <button id="campaignMenuButton">

    📖 Kampagne

</button>

<button id="missionsMenuButton">

    🎯 Missionen

</button>

<button id="chronikButton">

    📜 Chronik

</button>

    

        <button id="achievementButton">

    🏆 Errungenschaften

</button>

        <button>⚙ Einstellungen</button>

    </div>

</aside>

<main class="content">

    <div id="questListe"></div>

    <div id="chronikContainer" style="display:none;">
        

        <div id="chronikProfile"></div>

        <div id="chronikStats"></div>

        <div id="chronikRecords"></div>

    </div>

    <div id="achievementContainer" style="display:none;"></div>

</main>

<div id="startQuestOverlay" class="start-quest-overlay">

    <div class="start-quest-window">

        <h2 id="startOverlayTitle">

            📖 Kampagne starten

        </h2>

        <div class="start-quest-info">

            <div class="start-quest-image">

                <img
                    id="startQuestImage"
                    src="../assets/quest/urlaub.png"
                    alt="Quest">

            </div>

            <div class="start-quest-meta">

                <h3 id="startQuestName">

                    Im Urlaub

                </h3>

                <div class="start-quest-stats">

                    <span id="startQuestDifficulty">

                        🏅 A1

                    </span>

                    <span id="startQuestWords">

                        📖 53 Wörter

                    </span>

                    <span id="startQuestTime">

                        ⏱ --:--

                    </span>

                </div>

                <div class="start-quest-records">

                    <div class="record-box">

                        <div class="record-title">

                            🏆 Rekord

                        </div>

                        <div
                            class="record-value"
                            id="startQuestBestTime">

                            --:--

                        </div>

                    </div>

                    <div class="record-box">

                        <div class="record-title">

                            🎯 Genauigkeit

                        </div>

                        <div
                            class="record-value"
                            id="startQuestAccuracy">

                            -- %

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="mode-container">

            <div class="mode-card">

                <h3>📚 Lernen</h3>

                <p>📖 Deutscher Text sichtbar</p>

                <p>🧠 Lernphase</p>

                <p>🏁 Danach Prüfung</p>

                <button id="campaignButton">

                    ▶ START

                </button>

            </div>

            <div class="mode-card challenge">

                <h3>🏆 Challenge</h3>

                <p>🚫 Keine Hilfe</p>

                <p>🏆 Alles zählt</p>

                <p>⚡ Rekorde</p>

                <button id="challengeButton">

                    ▶ START

                </button>

            </div>

        </div>

        <button id="cancelQuestButton">

            Abbrechen

        </button>

    </div>

</div>

<script src="../js/save.js"></script>

<script src="../data/quests.js"></script>

<script src="../data/missions.js"></script>

<script src="../js/player.js"></script>

<script>

loadPlayer();
loadQuestStats();

</script>

<script src="../js/achievements.js"></script>



<script src="../js/chronik.js"></script>
<script src="../js/achievementRenderer.js"></script>
<script src="../js/thai-text-stats.js"></script>
<script src="../js/engine.js"></script>

<!-- PWA: registriert den Service Worker, verändert keine Spiellogik -->
<script src="../js/pwa-register.js"></script>




</body>

</html>
